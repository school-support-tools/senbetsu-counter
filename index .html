<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>選別カウンター</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background: linear-gradient(180deg, #51cbee 0%, #b3e5fc 50%, #b2ed85 85%, #8bc34a 100%);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 上部ヘッダー */
    .header-banner {
      background: #ffeb3b;
      border-radius: 20px;
      padding: 8px 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 0 #f57f17, 0 6px 10px rgba(0,0,0,0.15);
      margin-top: 10px;
      margin-bottom: 20px;
      transform: rotate(-2deg);
    }
    .popcorn-icon {
      font-size: 26px;
    }
    .header-title {
      font-size: 26px;
      font-weight: 900;
      color: #3e2723;
      letter-spacing: 1px;
    }

    /* メイン表示カード */
    .display-card {
      background: #fffde7;
      border: 4px solid #ffffff;
      border-radius: 30px;
      width: 100%;
      max-width: 340px;
      padding: 30px 15px 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }
    .label-remains {
      position: absolute;
      top: 15px;
      left: 30px;
      background: #ffca28;
      color: #3e2723;
      font-weight: 900;
      font-size: 18px;
      padding: 4px 18px;
      border-radius: 20px;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 0 #f57f17;
    }
    .count-display {
      font-size: 130px;
      font-weight: 900;
      color: #3e1b0e;
      line-height: 1;
      margin: 15px 0 0 0;
      text-shadow: 4px 4px 0px #ffe082, -2px -2px 0px #ffe082, 2px -2px 0px #ffe082, -2px 2px 0px #ffe082;
    }

    /* スタートボタン */
    .btn-start {
      background: linear-gradient(180deg, #4caf50 0%, #2e7d32 100%);
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      width: 100%;
      max-width: 340px;
      padding: 12px 0;
      border: 4px solid #ffffff;
      border-radius: 40px;
      box-shadow: 0 6px 0 #1b5e20, 0 10px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      text-shadow: 1px 2px 3px rgba(0,0,0,0.3);
      transition: all 0.1s;
    }
    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1b5e20, 0 4px 6px rgba(0,0,0,0.2);
    }

    /* 回数設定パネル */
    .setting-card {
      background: #ffffff;
      border-radius: 25px;
      width: 100%;
      max-width: 340px;
      padding: 15px 10px 20px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }
    .setting-title-bg {
      background: #e0f7fa;
      color: #00838f;
      font-weight: 900;
      font-size: 16px;
      display: inline-block;
      padding: 4px 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
    .preset-group {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      padding: 0 5px;
    }
    .btn-preset {
      flex: 1;
      background: #ffffff;
      border: 3px solid #cfd8dc;
      color: #37474f;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 0;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b0bec5;
      transition: all 0.1s;
    }
    .btn-preset.active {
      background: #1e88e5;
      border-color: #1565c0;
      color: #ffffff;
      box-shadow: 0 4px 0 #0d47a1;
    }
    .btn-preset:active {
      transform: translateY(2px);
    }

    .status-msg {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #1b5e20;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header-banner">
    <span class="popcorn-icon">🍿</span>
    <span class="header-title">選別カウンター</span>
  </div>

  <!-- メイン数字表示 -->
  <div class="display-card" id="clickArea">
    <div class="label-remains">残り</div>
    <div class="count-display" id="count">10</div>
  </div>

  <!-- スタートボタン -->
  <button class="btn-start" id="startBtn">
    <span>▶</span> スタート
  </button>

  <!-- 回数設定 -->
  <div class="setting-card">
    <div class="setting-title-bg">選別回数設定</div>
    <div class="preset-group">
      <button class="btn-preset active" data-val="10">10</button>
      <button class="btn-preset" data-val="15">15</button>
      <button class="btn-preset" data-val="20">20</button>
      <button class="btn-preset" data-val="25">25</button>
      <button class="btn-preset" data-val="30">30</button>
    </div>
  </div>

  <div class="status-msg" id="status">「スタート」を押してね</div>

<script>
  let targetCount = 10;
  let remaining = 10;
  let active = false;
  let lastTime = 0;
  let audioCtx = null;

  // 効果音（ピッ）
  function playBeep(freq = 600, duration = 0.08) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }

  // 完了時の効果音
  function playFanfare() {
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      setTimeout(() => playBeep(freq, 0.25), idx * 150);
    });
  }

  // カウント減少処理（0.9秒＝900msのブランクタイマー入り）
  function decrement() {
    if (!active) return;
    
    const now = Date.now();
    // 0.9秒以内の振動・タップはすべて無視
    if (now - lastTime < 900) {
      return;
    }
    lastTime = now;

    remaining--;
    if (remaining > 0) {
      document.getElementById('count').innerText = remaining;
      playBeep(800, 0.08);
    } else {
      document.getElementById('count').innerText = "0";
      document.getElementById('status').innerText = "🎉 おめでとう！選別完了！";
      playFanfare();
      active = false;
    }
  }

  // センサー処理
  function handleMotion(e) {
    if (!active) return;
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;

    const speed = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
    if (speed > 15) {
      decrement();
    }
  }

  // 数字カードをタップしてもカウント
  document.getElementById('clickArea').addEventListener('click', () => {
    if (active) decrement();
  });

  // 設定ボタン（10, 15, 20, 25, 30）の切り替え
  document.querySelectorAll('.btn-preset').forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (active) return; // 動作中は変更不可
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      targetCount = parseInt(e.target.getAttribute('data-val'), 10);
      remaining = targetCount;
      document.getElementById('count').innerText = remaining;
    });
  });

  // スタートボタンを押した時
  document.getElementById('startBtn').addEventListener('click', async () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    remaining = targetCount;
    document.getElementById('count').innerText = remaining;
    document.getElementById('status').innerText = "シャカシャカ振ってね！";
    
    active = true;
    lastTime = 0;
    playBeep(440, 0.1);

    // iPhone用 センサー許可要求
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const response = await DeviceMotionEvent.requestPermission();
        if (response === 'granted') {
          window.addEventListener('devicemotion', handleMotion, false);
        } else {
          document.getElementById('status').innerText = "（画面タップでカウントできます）";
        }
      } catch (err) {
        document.getElementById('status').innerText = "（画面タップでカウントできます）";
      }
    } else {
      window.addEventListener('devicemotion', handleMotion, false);
    }
  });
</script>

</body>
</html>
