<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>選別カウンター</title>
<style>
  :root{
    --bg:#000;
    --panel:#11141a;
    --line:#353b47;
    --text:#fff;
    --accent:#ffd21c;
    --muted:#c9c9c9;
    --ok:#48e06b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}
  body{padding:20px 18px 34px}
  button{font:inherit;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:900px;margin:auto}
  header{display:flex;align-items:center;gap:14px;margin:8px 0 20px}
  .logo{font-size:54px;line-height:1}
  h1{font-size:clamp(30px,6vw,48px);margin:0;font-weight:900;letter-spacing:.02em}
  .sub{font-size:clamp(15px,3vw,22px);color:#ddd;margin-top:5px}
  .menu{margin-left:auto;border:2px solid var(--line);background:#171b22;color:#fff;
    border-radius:16px;width:58px;height:58px;font-size:30px}
  .card{border:3px solid var(--line);border-radius:28px;background:#050505;margin:18px 0;padding:18px}
  .label{font-weight:900;font-size:clamp(18px,3vw,25px);white-space:nowrap}
  .counts{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:center}
  .count-btn{border:0;border-radius:28px;background:#242933;color:#fff;font-weight:900;
    font-size:clamp(20px,4vw,32px);padding:14px 4px;min-height:64px}
  .count-btn.selected{background:var(--accent);color:#000}
  .counter-card{min-height:250px;display:flex;align-items:center;justify-content:center}
  .remaining{display:flex;align-items:flex-end;gap:18px}
  .number{font-size:clamp(130px,25vw,230px);line-height:.82;font-weight:1000;letter-spacing:-.04em;color:#fff;
    text-shadow:0 2px 0 #222}
  .remain-word{font-size:clamp(22px,5vw,38px);font-weight:900;padding-bottom:8px}
  .start{width:min(680px,92%);display:block;margin:24px auto;border:0;border-radius:60px;
    background:var(--accent);color:#000;font-weight:1000;font-size:clamp(26px,5vw,42px);padding:20px 28px}
  .start:disabled{opacity:.65}
  .status{display:flex;align-items:center;gap:14px;font-size:clamp(18px,3.5vw,28px);font-weight:900}
  .sensor-icon{font-size:34px}
  .dot{width:18px;height:18px;border-radius:50%;background:#777;margin-left:auto;flex:none}
  .dot.ok{background:var(--ok)}
  .finish{display:none;text-align:center;padding:28px 10px 12px}
  .finish.show{display:block}
  .popcorn{font-size:clamp(150px,35vw,280px);line-height:.9;filter:drop-shadow(0 8px 10px #333)}
  .finish-title{font-size:clamp(58px,12vw,110px);font-weight:1000;margin:8px 0}
  .finish-sub{font-size:clamp(20px,4vw,32px);font-weight:800;color:#eee}
  .home{border:0;border-radius:55px;background:var(--accent);color:#000;font-weight:1000;
    font-size:clamp(23px,4vw,34px);padding:17px 34px;margin-top:24px}
  .hint{color:#ddd;text-align:center;font-size:clamp(15px,3vw,21px);margin:10px 0}
  .hidden-settings{display:none}
  @media(max-width:620px){
    body{padding:12px 10px 26px}
    header{gap:8px}.logo{font-size:40px}
    .menu{width:48px;height:48px;border-radius:13px;font-size:24px}
    .counts{gap:7px}.count-btn{min-height:56px}
    .card{border-radius:22px;padding:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🍿</div>
    <div>
      <h1>選別カウンター</h1>
      <div class="sub">ポップコーンの選別回数をカウントします</div>
    </div>
  </header>

  <section id="mainUI">
    <div class="card">
      <div class="counts">
        <div class="label">回数設定</div>
        <button class="count-btn" data-count="5">5</button>
        <button class="count-btn selected" data-count="10">10</button>
        <button class="count-btn" data-count="15">15</button>
        <button class="count-btn" data-count="20">20</button>
        <button class="count-btn" data-count="25">25</button>
        <button class="count-btn" data-count="30">30</button>
      </div>
    </div>

    <div class="card counter-card">
      <div class="remaining">
        <div id="number" class="number">10</div>
        <div class="remain-word">残り</div>
      </div>
    </div>

    <button id="startBtn" class="start">▶ スタート</button>

    <div class="card status">
      <span class="sensor-icon">(( 📱 ))</span>
      <span id="message">スタートを押してください</span>
      <span id="dot" class="dot"></span>
    </div>

    <div class="hint">iPadをケースに固定して、ケースを1回ずつしっかり揺らしてください。</div>
  </section>

  <section id="finishUI" class="finish">
    <div class="popcorn" aria-label="ポップコーン">🍿</div>
    <div class="finish-title">おわり！</div>
    <div class="finish-sub">たくさん選別できました！</div>
    <button id="homeBtn" class="home">⌂ はじめに戻る</button>
  </section>

  <!-- 教員向け調整値は画面には表示しません -->
  <div class="hidden-settings" aria-hidden="true">
    <input id="sensitivity" value="1.8">
    <input id="interval" value="0.9">
  </div>
</div>

<script>
(() => {
  "use strict";

  // 教員向けの内部設定（画面には表示しません）
  const MOTION_THRESHOLD = 1.8;     // 揺れ感度
  const MIN_INTERVAL_MS = 900;      // 振動間の最短時間（0.9秒）

  let initial = 10;
  let remaining = 10;
  let running = false;
  let lastCountAt = 0;
  let lastMagnitude = 0;
  let motionHandler = null;
  let audioCtx = null;

  const numberEl = document.getElementById("number");
  const messageEl = document.getElementById("message");
  const dotEl = document.getElementById("dot");
  const startBtn = document.getElementById("startBtn");
  const homeBtn = document.getElementById("homeBtn");
  const mainUI = document.getElementById("mainUI");
  const finishUI = document.getElementById("finishUI");

  function updateNumber() {
    numberEl.textContent = remaining;
  }

  function prepareAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch(e) {}
  }

  function playFinishAlarm() {
    // スタート操作でAudioContextを準備しておき、終了時に短い通知音を鳴らす
    try {
      if (!audioCtx) prepareAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.18, 0.36].forEach((offset, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = i === 1 ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.14);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.16);
      });
    } catch(e) {}
  }

  function finish() {
    running = false;
    remaining = 0;
    updateNumber();
    if (motionHandler) {
      window.removeEventListener("devicemotion", motionHandler);
      motionHandler = null;
    }
    mainUI.style.display = "none";
    finishUI.classList.add("show");
    playFinishAlarm();
  }

  function countOne() {
    const now = performance.now();
    if (!running || now - lastCountAt < MIN_INTERVAL_MS) return;
    lastCountAt = now;
    remaining = Math.max(0, remaining - 1);
    updateNumber();

    if (remaining === 0) {
      finish();
    }
  }

  function magnitude(a) {
    const x = Number(a.x) || 0;
    const y = Number(a.y) || 0;
    const z = Number(a.z) || 0;
    return Math.sqrt(x*x + y*y + z*z);
  }

  function handleMotion(event) {
    if (!running) return;

    const a = event.acceleration || event.accelerationIncludingGravity;
    if (!a) return;

    const m = magnitude(a);
    const delta = Math.abs(m - lastMagnitude);
    lastMagnitude = m;

    // 連続的な小さな動きより、明確なピークを検出
    if (delta >= MOTION_THRESHOLD) countOne();
  }

  async function requestSensorPermission() {
    if (typeof DeviceMotionEvent === "undefined") {
      throw new Error("DeviceMotionEvent unavailable");
    }
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      const result = await DeviceMotionEvent.requestPermission();
      if (result !== "granted") throw new Error("permission denied");
    }
  }

  async function start() {
    prepareAudio();
    if (remaining === 0) remaining = initial;
    startBtn.disabled = true;
    messageEl.textContent = "センサーを準備しています…";
    dotEl.className = "dot";

    try {
      await requestSensorPermission();

      if (motionHandler) window.removeEventListener("devicemotion", motionHandler);
      motionHandler = handleMotion;
      window.addEventListener("devicemotion", motionHandler, {passive:true});

      running = true;
      lastCountAt = performance.now();
      lastMagnitude = 0;
      messageEl.textContent = "ケースを揺らしてください";
      dotEl.className = "dot ok";
      startBtn.textContent = "● 計測中";
    } catch(error) {
      running = false;
      messageEl.textContent = "センサーを使えません";
      dotEl.className = "dot";
      alert("iPadの動きセンサーを利用できません。\\nSafariでこのページを開き、「スタート」を押して許可してください。\\n※HTTPSで公開されたページで使用してください。");
    } finally {
      startBtn.disabled = false;
    }
  }

  function resetHome() {
    running = false;
    if (motionHandler) {
      window.removeEventListener("devicemotion", motionHandler);
      motionHandler = null;
    }
    remaining = initial;
    updateNumber();
    finishUI.classList.remove("show");
    mainUI.style.display = "";
    messageEl.textContent = "スタートを押してください";
    dotEl.className = "dot";
    startBtn.textContent = "▶ スタート";
  }

  document.querySelectorAll(".count-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (running) return;
      document.querySelectorAll(".count-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      initial = Number(btn.dataset.count);
      remaining = initial;
      updateNumber();
    });
  });

  startBtn.addEventListener("click", start);
  homeBtn.addEventListener("click", resetHome);
  updateNumber();
})();
</script>
</body>
</html>
